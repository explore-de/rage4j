server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase buffer sizes for large headers (JWT tokens)
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
